# XcodeGen spec for the iOS app. `xcodegen generate` (in this folder)
# writes MimizanLab.xcodeproj, which is not committed. The core comes from
# the local Swift package ../ios/MimizanCore, filled by scripts/build_ios.sh.
name: MimizanLab
options:
  bundleIdPrefix: ch.bojovic
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.17.28"
    CURRENT_PROJECT_VERSION: "27"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MimizanCore:
    path: MimizanCore

targets:
  MimizanLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MimizanLab
        excludes:
          - "MimizanLab.entitlements"
          - "MimizanLab-Bridging-Header.h"
      - path: ../cameras
        type: folder
        buildPhase: resources
    dependencies:
      - package: MimizanCore
    entitlements:
      path: MimizanLab/MimizanLab.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.bojovic.mimizanlab
        PRODUCT_NAME: MimizanLab
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # There is no Info.plist in the source tree: Xcode generates it from
        # these INFOPLIST_KEY_* settings (plus the CFBundle* defaults), so the
        # App Store export keeps orientations, permissions and the launch
        # screen. A usage description, an orientation or a launch-screen
        # setting is added here, nowhere else. The privacy manifest is
        # PrivacyInfo.xcprivacy, the entitlements MimizanLab.entitlements.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Mimizan Lab"
        INFOPLIST_KEY_NSCameraUsageDescription: "Mimizan Lab reads the sensor's raw frame to develop the negative. Nothing leaves the device."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Finished pictures are added to your Photos library."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # All four for the bundle: App Store Connect refuses an iPad build
        # with fewer (multitasking). The phone stays upright through the
        # AppDelegate, which answers Portrait alone there.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # The Rust static library needs these; the package declares them too,
        # and the app target repeats them for a link that does not inherit.
        OTHER_LDFLAGS: "-liconv -lresolv"
        MTL_ENABLE_DEBUG_INFO: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: MimizanLab/MimizanLab-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/MimizanLab"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

[package]
name = "mimizan-mobile"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Dragan Bojovic"]
description = "Mimizan Lab core for Android: Camera2 RAW_SENSOR -> linear monochrome negative -> print, via UniFFI"
publish = false

[lib]
name = "mimizan_mobile"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
# `uniffi-bindgen` binary (Kotlin code generation on the host).
bindgen = ["uniffi/cli"]
# Host-only: decode RAW files through rawler for the round-trip tests
# (Camera2-style `RawInput` vs. the file decoder must give the same negative).
host-raw = ["mimizan-core/decode-rawler"]

[dependencies]
mimizan-core = { path = "../../../mimizan/crates/mimizan-core", default-features = false }
uniffi = { version = "0.32" }
rayon = "1.12"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
tracing-subscriber = "0.3"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = "debuginfo"
panic = "unwind"

[profile.dev]
# The separation is far too slow unoptimised; tests run on real sizes.
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# Builds the iOS app on a macOS runner: the Rust core for arm64 iOS, the
# UniFFI Swift bindings, the xcframework, the XcodeGen project, then an
# unsigned Release build for a generic iOS device. The artifact is the
# unsigned .app (and the same as a Payload/.ipa for re-signing tools);
# nothing here needs an Apple developer account.
#
# The core is the git commit in mimizan-core.ref (Cargo.toml `rev`), checked
# out beside this repo so the build carries the same core as the APK
# (scripts/set_version.sh writes the pin).
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "rust/**"
      - "cameras/**"
      - "mimizan-core.ref"
      - "scripts/build_ios.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "rust/**"
      - "cameras/**"
      - "mimizan-core.ref"
      - "scripts/build_ios.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (host tests, iOS check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: mimizan-lab-mobile
      - name: Core commit
        id: core
        run: echo "sha=$(tr -d '[:space:]' < mimizan-lab-mobile/mimizan-core.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Draganito/mimizan
          ref: ${{ steps.core.outputs.sha }}
          path: mimizan
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mimizan-lab-mobile/rust/mimizan-mobile
      - name: Format and lints
        working-directory: mimizan-lab-mobile/rust/mimizan-mobile
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets --features host-raw -- -D warnings
      - name: Host tests (file decoder on)
        # The desktop's `testdata/` (the NEF of the bit-for-bit round trip)
        # is gitignored and not in the mimizan checkout. Synthetic FFI tests
        # always run; the NEF proof skips only because MIMIZAN_ALLOW_SKIP_HOST
        # is set here on purpose. Without that env the test fails if the file
        # is missing.
        working-directory: mimizan-lab-mobile/rust/mimizan-mobile
        env:
          MIMIZAN_ALLOW_SKIP_HOST: "1"
        run: cargo test --release --features host-raw
      - name: iOS static library (cross-check from Linux)
        working-directory: mimizan-lab-mobile/rust/mimizan-mobile
        run: IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo rustc --release --target aarch64-apple-ios --lib --features decode-files --crate-type staticlib

  app:
    name: Unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: mimizan-lab-mobile
      - name: Core commit
        id: core
        run: echo "sha=$(tr -d '[:space:]' < mimizan-lab-mobile/mimizan-core.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Draganito/mimizan
          ref: ${{ steps.core.outputs.sha }}
          path: mimizan
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mimizan-lab-mobile/rust/mimizan-mobile
      - name: Xcode 26
        # App Store Connect rejects anything built with an SDK older than
        # iOS 26, so the unsigned build uses the same toolchain as the
        # TestFlight one. "26" is the newest 26.x the runner has, so a
        # retired point release does not stop the build.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Core, bindings, xcframework
        working-directory: mimizan-lab-mobile
        run: scripts/build_ios.sh --device-only
      - name: XcodeGen
        working-directory: mimizan-lab-mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (Release, generic iOS device, unsigned)
        working-directory: mimizan-lab-mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MimizanLab.xcodeproj \
            -scheme MimizanLab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            build | tee build.log | grep -E "error:|\.swift:[0-9]+:[0-9]+: warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Package
        working-directory: mimizan-lab-mobile/ios
        run: |
          app=$(find DerivedData/Build/Products -name "MimizanLab.app" -type d | head -1)
          test -n "$app"
          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qry MimizanLab-unsigned.ipa Payload)
          (cd out && zip -qry MimizanLab-unsigned.app.zip Payload/MimizanLab.app)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: MimizanLab-ios-unsigned
          path: |
            mimizan-lab-mobile/ios/out/MimizanLab-unsigned.ipa
            mimizan-lab-mobile/ios/out/MimizanLab-unsigned.app.zip
          if-no-files-found: error
      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mimizan-lab-mobile/ios/build.log
          if-no-files-found: ignore
